# render.yaml
services:
  - type: web
    name: django-app
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn catalogo_muebles.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: catalogo_muebles.settings
      - key: DATABASE_URL
        fromDatabase:
          name: django-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false

databases:
  - name: django-db
    plan: free

